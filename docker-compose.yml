# SkyWalking 10.3.0 - 支持 OTLP Traces
#
# 启动方式：
#   docker-compose up -d
#
# 访问地址：
#   SkyWalking UI：http://localhost:8080
#   Zipkin Lens（OTLP Traces）：http://localhost:8080/zipkin
#
# zltrace 配置（trace.yaml）：
#   exporter:
#     type: otlp
#     otlp:
#       endpoint: localhost:11800
#       insecure: true

version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.4.2
    container_name: elasticsearch
    ports:
      - "9200:9200"
    networks:
      - skywalking
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data

  oap:
    image: ghcr.io/apache/skywalking/oap:latest
    container_name: skywalking-oap
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "11800:11800"   # gRPC（OTLP traces + SkyWalking Agent）
      - "12800:12800"   # HTTP REST（UI 通信）
    networks:
      - skywalking
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:12800/internal/l7check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
      SW_HEALTH_CHECKER: default
      SW_TELEMETRY: prometheus
      JAVA_OPTS: "-Xms2048m -Xmx2048m"
      # 启用 OTLP Traces 接收（默认只启用 otlp-metrics,otlp-logs）
      SW_OTEL_RECEIVER_ENABLED_HANDLERS: "otlp-traces"
      # 启用 Zipkin 接收器（OTLP traces 内部转为 Zipkin 格式）
      SW_RECEIVER_ZIPKIN: "default"
      # 启用 Zipkin 查询
      SW_QUERY_ZIPKIN: "default"

  ui:
    image: ghcr.io/apache/skywalking/ui:latest
    container_name: skywalking-ui
    depends_on:
      oap:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - skywalking
    environment:
      SW_OAP_ADDRESS: http://oap:12800
      # Zipkin Lens 地址（用于查看 OTLP Traces）
      SW_ZIPKIN_ADDRESS: http://oap:9412

networks:
  skywalking:

volumes:
  es_data:
    driver: local
